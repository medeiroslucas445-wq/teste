<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoTracker - Mapa de Localização em Tempo Real</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    
    /* Custom Map Marker Pulse Animation */
    .user-location-pulse {
      position: relative;
    }
    
    .user-location-pulse::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      top: -4px;
      left: -4px;
      background-color: rgba(59, 130, 246, 0.4);
      border-radius: 50%;
      animation: pulse-ring 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.5); opacity: 1; }
      80%, 100% { transform: scale(2.2); opacity: 0; }
    }

    /* Override Leaflet controls styling */
    .leaflet-control-zoom {
      border: none !important;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05) !important;
      border-radius: 12px !important;
      overflow: hidden;
    }
    
    .leaflet-control-zoom a {
      background-color: #ffffff !important;
      color: #374151 !important;
      border-bottom: 1px solid #f3f4f6 !important;
    }

    .leaflet-control-zoom a:hover {
      background-color: #f9fafb !important;
      color: #1d4ed8 !important;
    }
  </style>
</head>
<body class="bg-slate-900 h-screen w-screen overflow-hidden flex flex-col antialiased selection:bg-blue-500 selection:text-white">

  <!-- Top Navigation Header -->
  <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 text-white z-[1000] px-4 py-3 flex items-center justify-between shadow-lg shrink-0">
    <div class="flex items-center space-x-3">
      <div class="bg-blue-600 p-2 rounded-xl text-white shadow-md shadow-blue-500/20">
        <i data-lucide="navigation" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="font-bold text-base md:text-lg tracking-tight leading-none text-white">GeoTracker</h1>
        <p class="text-xs text-slate-400 mt-0.5">Localização e Mapeamento em Tempo Real</p>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
      <span id="status-badge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700 transition-all duration-300">
        <span class="w-2 h-2 rounded-full bg-slate-400" id="status-dot"></span>
        <span id="status-text">Inativo</span>
      </span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="relative flex-1 w-full h-full">
    
    <!-- Leaflet Map Container -->
    <div id="map" class="w-full h-full bg-slate-950 z-0"></div>

    <!-- Floating Control Panel Overlay -->
    <div class="absolute bottom-6 left-4 right-4 md:left-6 md:right-auto md:w-96 z-[1000] space-y-3 pointer-events-none">
      
      <!-- Notification Box (Hidden by default) -->
      <div id="toast-message" class="hidden pointer-events-auto bg-red-500/90 backdrop-blur-md text-white text-sm p-4 rounded-2xl shadow-xl border border-red-400/30 flex items-start gap-3 transform transition-all duration-300 ease-out">
        <i data-lucide="alert-circle" class="w-5 h-5 shrink-0 mt-0.5"></i>
        <div class="flex-1">
          <h4 class="font-semibold text-sm">Erro de Localização</h4>
          <p id="toast-text" class="text-xs text-red-100 mt-0.5">Não foi possível obter a posição atual.</p>
        </div>
        <button onclick="dismissToast()" class="text-red-200 hover:text-white p-1">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Main Telemetry Dashboard Panel -->
      <div class="pointer-events-auto bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-2xl p-4 md:p-5 text-white transition-all duration-300">
        
        <!-- Live Details Grid -->
        <div class="grid grid-cols-2 gap-3 mb-4">
          <div class="bg-slate-800/60 border border-slate-700/50 p-3 rounded-xl">
            <div class="flex items-center text-slate-400 text-xs gap-1.5 mb-1">
              <i data-lucide="map-pin" class="w-3.5 h-3.5 text-blue-400"></i>
              <span>Coordenadas</span>
            </div>
            <div id="coords-display" class="font-mono text-xs font-semibold text-slate-200 truncate">
              --.------, --.------
            </div>
          </div>

          <div class="bg-slate-800/60 border border-slate-700/50 p-3 rounded-xl">
            <div class="flex items-center text-slate-400 text-xs gap-1.5 mb-1">
              <i data-lucide="crosshair" class="w-3.5 h-3.5 text-emerald-400"></i>
              <span>Precisão</span>
            </div>
            <div id="accuracy-display" class="font-mono text-xs font-semibold text-slate-200">
              -- m
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col gap-2">
          
          <button id="btn-find-me" onclick="triggerSingleLocationFetch()" class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 transition-all duration-200 shadow-lg shadow-blue-600/25">
            <i data-lucide="locate" class="w-4 h-4"></i>
            <span>Minha Localização</span>
          </button>

          <div class="flex items-center justify-between bg-slate-800/40 border border-slate-800 p-2.5 rounded-xl px-3 mt-1">
            <div class="flex items-center gap-2">
              <i data-lucide="radio" class="w-4 h-4 text-emerald-400 animate-pulse"></i>
              <span class="text-xs font-medium text-slate-300">Rastreamento Contínuo</span>
            </div>
            
            <!-- Toggle Switch -->
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="toggle-tracking" onchange="toggleLiveTracking(this.checked)" class="sr-only peer">
              <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>
            </label>
          </div>

        </div>

      </div>
    </div>
  </main>

  <script>
    // State Variables
    let map = null;
    let userMarker = null;
    let accuracyCircle = null;
    let watchId = null;
    let isTrackingActive = false;

    // Custom Icon Definition for User Location
    const userLocationIcon = L.divIcon({
      className: 'user-location-pulse',
      html: `
        <div class="w-4 h-4 bg-blue-500 border-2 border-white rounded-full shadow-lg"></div>
      `,
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });

    // Initialize Map on Load
    window.addEventListener('load', () => {
      // Initialize Lucide Icons
      lucide.createIcons();

      // Default fallback view (Center of World / Standard Zoom)
      map = L.map('map', {
        zoomControl: false,
        attributionControl: false
      }).setView([20, 0], 2);

      // Add Zoom Control at Top Right
      L.control.zoom({ position: 'topright' }).addTo(map);

      // Add OpenStreetMap Dark/Standard Tile Layer (CartoDB Dark Matter for modern look)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        subdomains: 'abcd'
      }).addTo(map);

      // Attempt initial soft location lookup
      triggerSingleLocationFetch(false);
    });

    // Helper: Update Status Indicator UI
    function setStatus(type, message) {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      const badge = document.getElementById('status-badge');

      text.innerText = message;

      if (type === 'active') {
        dot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-ping";
        badge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-950/60 text-emerald-300 border border-emerald-800/60";
      } else if (type === 'loading') {
        dot.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse";
        badge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-amber-950/60 text-amber-300 border border-amber-800/60";
      } else if (type === 'error') {
        dot.className = "w-2 h-2 rounded-full bg-red-400";
        badge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-red-950/60 text-red-300 border border-red-800/60";
      } else {
        dot.className = "w-2 h-2 rounded-full bg-slate-400";
        badge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700";
      }
    }

    // Update or Create User Marker and Accuracy Circle on Map
    function updateMapLocation(latitude, longitude, accuracy, centerMap = true) {
      const latLng = [latitude, longitude];

      // Update UI Telemetry
      document.getElementById('coords-display').innerText = `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
      document.getElementById('accuracy-display').innerText = `± ${Math.round(accuracy)} metros`;

      // Update or create User Location Marker
      if (userMarker) {
        userMarker.setLatLng(latLng);
      } else {
        userMarker = L.marker(latLng, { icon: userLocationIcon }).addTo(map);
        userMarker.bindPopup('<div class="text-xs font-semibold text-slate-800">Você está aqui</div>').openPopup();
      }

      // Update or create Accuracy Circle
      if (accuracyCircle) {
        accuracyCircle.setLatLng(latLng);
        accuracyCircle.setRadius(accuracy);
      } else {
        accuracyCircle = L.circle(latLng, {
          radius: accuracy,
          color: '#3b82f6',
          fillColor: '#3b82f6',
          fillOpacity: 0.15,
          weight: 1
        }).addTo(map);
      }

      // Recenter view if requested
      if (centerMap) {
        map.flyTo(latLng, 16, {
          animate: true,
          duration: 1.2
        });
      }
    }

    // Trigger Single Location Lookup
    function triggerSingleLocationFetch(userInitiated = true) {
      if (!navigator.geolocation) {
        showToast('A geolocalização não é suportada pelo seu navegador.');
        return;
      }

      setStatus('loading', 'Localizando...');

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const { latitude, longitude, accuracy } = position.coords;
          updateMapLocation(latitude, longitude, accuracy, true);
          setStatus('idle', 'Localizado');
          dismissToast();
        },
        (error) => {
          if (userInitiated) {
            handleGeolocationError(error);
          } else {
            setStatus('idle', 'Inativo');
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    // Enable or Disable Continuous Live Tracking
    function toggleLiveTracking(enable) {
      isTrackingActive = enable;

      if (enable) {
        if (!navigator.geolocation) {
          showToast('A geolocalização não é suportada pelo seu navegador.');
          document.getElementById('toggle-tracking').checked = false;
          return;
        }

        setStatus('active', 'Rastreando');

        watchId = navigator.geolocation.watchPosition(
          (position) => {
            const { latitude, longitude, accuracy } = position.coords;
            updateMapLocation(latitude, longitude, accuracy, true);
            setStatus('active', 'Ao Vivo');
          },
          (error) => {
            handleGeolocationError(error);
            toggleLiveTracking(false);
            document.getElementById('toggle-tracking').checked = false;
          },
          {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
          }
        );
      } else {
        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }
        setStatus('idle', 'Rastreamento Parado');
      }
    }

    // Error Handling for Geolocation API
    function handleGeolocationError(error) {
      let message = 'Ocorreu um erro desconhecido ao obter a localização.';
      switch (error.code) {
        case error.PERMISSION_DENIED:
          message = 'Acesso à localização negado. Por favor, permita a permissão no seu navegador.';
          break;
        case error.POSITION_UNAVAILABLE:
          message = 'Informações de localização indisponíveis no seu dispositivo.';
          break;
        case error.TIMEOUT:
          message = 'A requisição de localização expirou. Tente novamente.';
          break;
      }
      setStatus('error', 'Erro');
      showToast(message);
    }

    // Toast Notification Helpers
    function showToast(text) {
      const toast = document.getElementById('toast-message');
      const toastText = document.getElementById('toast-text');
      toastText.innerText = text;
      toast.classList.remove('hidden');
    }

    function dismissToast() {
      const toast = document.getElementById('toast-message');
      toast.classList.add('hidden');
    }
  </script>
</body>
</html>
